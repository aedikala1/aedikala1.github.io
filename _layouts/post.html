---
layout: default
---

<main class="wrap">
  <a class="back" href="{{ '/' | relative_url }}">← Notes</a>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  <article class="post-content">
    {{ content }}
  </article>
</main>
